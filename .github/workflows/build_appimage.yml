name: "Build AppImage"

on:
  workflow_dispatch:
  push:
    tags: 
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packaging/docker/Dockerfile -t gogstash-builder .
      - run: | 
          docker create --name extract gogstash-builder
          docker cp extract:/build/gogstash-x86_64.AppImage .
          docker rm extract
      - uses: actions/upload-artifact@v4
        with: 
          name: gogstash-appimage
          path: gogstash-x86_64.AppImage
      - if: github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '/^## /{p = index($0, heading) == 1} p' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} gogstash-x86_64.AppImage --notes-file release_notes.md
    permissions:
      contents: write
    
    
