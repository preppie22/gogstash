name: "Build AppImage"

on:
  workflow_dispatch:
  push:
    tags: 
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packaging/docker/Dockerfile -t gogstash-builder .
      - run: | 
          docker create --name extract gogstash-builder
          docker cp extract:/build/gogstash-x86_64.AppImage .
          docker rm extract
      - uses: actions/upload-artifact@v4
        with: 
          name: gogstash-appimage
          path: gogstash-x86_64.AppImage
      - if: github.event_name == 'push'
        run: awk '/^## /{c++} c==1' CHANGELOG.md > release_notes.md
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} gogstash-x86_64.AppImage --notes-file release_notes.md
    permissions:
      contents: write
    
    
