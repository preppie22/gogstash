[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gogstash"
version = "0.1.0"
description = "A desktop GUI for downloading and backing up your GOG.com game library"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Piyush Puranik", email = "piyushpuranik@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "requests",
    "html5lib",
    "psutil",
    "PySide6",
    "platformdirs",
    "humanize",
]

[project.urls]
Homepage = "https://github.com/preppie22/gogstash"

[project.scripts]
gogstash = "gogstash.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-testdox",
]
packaging = ["pyinstaller"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--testdox"

[tool.setuptools.package-data]
gogstash = ["icons/light/*.svg", "icons/dark/*.svg"]
